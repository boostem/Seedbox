# Seedbox 2's Python tests on Linux and Windows (#37), on every pull request and push to main. The full matrix
# (macOS too, the frontends, nightly model tests) is #41's.
name: seedbox2-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_seedbox2.py tests/test_seedbox2_eval.py -q
