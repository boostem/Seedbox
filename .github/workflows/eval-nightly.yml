# Seedbox 2 analysis evaluation (#50): every night, score the analysers on the first 50 GiantSteps Tempo and Key
# previews and fail when a metric drops more than 2 points below seedbox2/eval/baseline.json.
name: eval-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEEDBOX2_EVAL_DATA: ${{ github.workspace }}/eval-data
      SEEDBOX2_EVAL_RESULTS: ${{ github.workspace }}/eval-results
      SEEDBOX_CACHE_DIR: ${{ github.workspace }}/.seedbox-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: eval-data
          key: eval-data-giantsteps-50-v1
      - run: python -m seedbox2.eval fetch giantsteps-tempo giantsteps-key --limit 50
      - uses: actions/cache@v4
        with:
          path: .seedbox-cache/models
          key: models-${{ runner.os }}-${{ hashFiles('seedbox2/models/**') }}
          restore-keys: models-${{ runner.os }}-
      - name: Download the models (the seedbox2 analysers need Beat This!)
        run: >-
          python -c "from seedbox2.models import store; from seedbox2.models.registry import MODELS;
          [store.download(s, store.models_dir()) for s in MODELS.values()]"
      - run: >-
          python -m seedbox2.eval analysis --dataset giantsteps-tempo --dataset giantsteps-key --limit 50
          --analyser seedbox1 --analyser seedbox2
          --baseline seedbox2/eval/baseline.json --max-drop 2 --out eval-results/nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results/
