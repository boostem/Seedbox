# The golden corpus (#87): real track pairs every engine version is rendered on. `python -m seedbox2.eval golden`.
#
# Only hashes and metadata live here; the audio stays on the machine. A track is found by `hash`, the library's hash of
# its decoded audio (seedbox2/library/hashing.py), so a retagged or renamed file still matches. Tracks with a `source`
# are free to download (put them in an audio folder); the others are from the owner's library.
#
# bpm and key describe the track, and only choose and label the pairs and give Seedbox 1 its keys: the engines do their
# own analysis. bpm is Seedbox 1's analysis, except the drum & bass, which it reads at 2/3 of the tempo: those are from
# onset periodicity. key is a Krumhansl-Schmuckler estimate from a whole-track chromagram, so expect some to be wrong
# until our own key detection (#45) replaces it; `Found A Cure` is the key in the owner's file name.
#
# tags: a genre (house, techno, dnb, hiphop, pop, disco, halftime), `key-clash` (3 or more Camelot steps apart) and
# `vocal-heavy` (both tracks sing or rap most of the way). The tempo gap is computed; `golden check` and the tests hold
# the corpus to the coverage it promises. `disco` holds live drums. `halftime-double-time` is a 1:2 tempo pair.
#
# Changing a pair invalidates comparisons of that pair only; ids must stay stable. New tracks: `golden track FILE...`.


